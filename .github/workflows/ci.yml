name: ci
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build AndinWin.slnx -c Release
      - run: dotnet test tests/AndinWin.Core.Tests/AndinWin.Core.Tests.csproj -c Release --no-build
      - run: powershell -ExecutionPolicy Bypass -File tools/poc-check.ps1 -Distro Ubuntu-24.04
        continue-on-error: true
